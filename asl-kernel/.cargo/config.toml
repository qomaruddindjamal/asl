# Catatan: tidak ada default [build] target — build bare-metal SELALU memakai
# --target eksplisit (skrip/Makefile), sehingga `cargo test --workspace --lib`
# berjalan di host target secara default.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "link-arg=-Taarch64_virt.ld",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
    "-C", "relocation-model=static",
]

