name: asl-ci-minimal

# PHASE-5D CI minimal. Refleksi dari scripts/ci_local.ps1 (runner yang SAH dan
# sudah dibuktikan hijau di repo ini). GitHub-hosted TIDAK dapat menjalankan
# langkah [3/4] QEMU cold-boot (butuh hypervisor + xorriso build cygwin + Limine
# + path ISO lokal), sehingga workflow hosted hanya menegakkan [1/2].
# Langkah 3-4 TETAP WAJIB lewat scripts/ci_local.ps1 sebelum merge:
# pipeline merah = tidak boleh merge.
#
# CATATAN: jangan set env RUSTFLAGS di sini — file .cargo/config.toml sudah
# memuat rustflags wajib per-target (-Tlinker.ld, relocation/code model), dan
# env RUSTFLAGS akan MENGGANTIKAN (bukan menambah) nilai config tersebut sehingga
# link gagal. Gerbang "0 warning" ditegakkan oleh langkah [2/4] ci_local.ps1
# yang mem-parse keluaran build, bukan lewat -D warnings di runner hosted.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asl-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: "[1/2] cargo test --workspace --lib"
        run: cargo test --workspace --lib
      - name: "[2/2] cargo build --package asl-kernel-bin --target x86_64-unknown-none --release"
        run: cargo build --package asl-kernel-bin --target x86_64-unknown-none --release
      - name: "Bukti footprint ELF hasil build"
        run: ls -l target/x86_64-unknown-none/release/asl-kernel

  # PHASE-7 T2 — job coverage NON-BLOCKING. Nama job 'coverage' SENGAJA tidak
  # dipasang sebagai required status check (branch protection main hanya
  # mengunci contexts: ["test-and-build"]), dan continue-on-error membuat job
  # ini tidak pernah membuat pipeline merah walau ambangnya tidak tercapai.
  # Angka ambang di bawah diambil dari BASELINE HOST yang terukur dan
  # ter-commit: lines TOTAL 86,82% pada rev 489d4ee
  # (Analysis/reports/coverage_baseline_t2_2026-10-21.log), diberi margin 6,82
  # poin ke 80 karena runner Linux memakai build LLVM sendiri sehingga angka
  # CI bisa berbeda beberapa digit. Ambang ini ADVISORY, bukan gerbang rilis.
  # Cakupan sengaja tetap tiga crate (bukan workspace) sesuai kontrak T2.
  # cargo-llvm-cov = tooling host yang di-install di runner, BUKAN dependency
  # crate workspace (G1); nol berkas .rs disentuh job ini.
  coverage:
    name: coverage (non-blocking, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: asl-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: "[1/2] cargo install cargo-llvm-cov --locked (tooling host, bukan dependency)"
        run: cargo install cargo-llvm-cov --locked
      - name: "[2/2] cargo llvm-cov tiga crate --lib (ambang advisory lines >= 80)"
        run: >
          cargo llvm-cov -p asl-storage -p asl-bootloader
          -p asl-kernel-core-secondary --lib --summary-only
          --fail-under-lines 80
